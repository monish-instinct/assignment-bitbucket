<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculator UI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="calculator.css">

</head>

<body>

<div class="container">

<section class="display">

<h1>123456789</h1>

</section>


<section class="buttons">

<div class="btn">C</div>
<div class="btn">+/-</div>
<div class="btn">%</div>
<div class="btn operator">÷</div>

<div class="btn">7</div>
<div class="btn">8</div>
<div class="btn">9</div>
<div class="btn operator">×</div>

<div class="btn">4</div>
<div class="btn">5</div>
<div class="btn">6</div>
<div class="btn operator">−</div>

<div class="btn">1</div>
<div class="btn">2</div>
<div class="btn">3</div>
<div class="btn operator">+</div>

<div class="btn zero">0</div>
<div class="btn">.</div>
<div class="btn operator">=</div>

</section>

</div>

</body>
</html>
