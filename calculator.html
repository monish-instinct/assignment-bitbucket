<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Roboto',sans-serif;
}

body{

background:black;

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;
}


.container{

width:880px;
background:black;
}


.display{

height:260px;

display:flex;
justify-content:flex-end;
align-items:flex-end;

padding:40px;
background:black;
}

.display h1{

color:white;

font-size:95px;
font-weight:100;

letter-spacing:2px;
}


.buttons{

display:grid;
grid-template-columns:repeat(4,1fr);

}

.btn{

height:155px;

background:#d3d3d3;

display:flex;
justify-content:center;
align-items:center;

font-size:55px;
font-weight:300;

color:#333;

border:1px solid #111;
}


.operator{

background:#ff8c00;
color:white;
}


.zero{

grid-column:span 2;
}

</style>

</head>

<body>

<div class="container">

<section class="display">
<h1>123456789</h1>
</section>


<section class="buttons">

<div class="btn">C</div>
<div class="btn">+/-</div>
<div class="btn">%</div>
<div class="btn operator">/</div>

<div class="btn">7</div>
<div class="btn">8</div>
<div class="btn">9</div>
<div class="btn operator">×</div>

<div class="btn">4</div>
<div class="btn">5</div>
<div class="btn">6</div>
<div class="btn operator">−</div>

<div class="btn">1</div>
<div class="btn">2</div>
<div class="btn">3</div>
<div class="btn operator">+</div>

<div class="btn zero">0</div>
<div class="btn">.</div>
<div class="btn operator">=</div>

</section>

</div>

</body>
</html>
